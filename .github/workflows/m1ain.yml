name: 24-7 Auto Creation Runner
on:
  schedule:
    - cron: '0 */2 * * *'  # Runs automatically every 2 hours
  workflow_dispatch:        # Lets you test it manually anytime

jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clone repository files
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install packages
        run: python -m pip install requests

      - name: 4. Automatically Create runner.py
        run: |
          cat << 'EOF' > runner.py
          import os
          import requests

          print("--- SUCCESS ---")
          print("runner.py was automatically created by GitHub!")
          
          # Your script logic goes here:
          api_key = os.environ.get("API_KEY")
          print("Automation running smoothly.")
          EOF

      - name: 5. Execute the created file
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python runner.py
